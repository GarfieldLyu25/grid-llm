[project]
name = "grid-llm"
version = "0.1.0"
description = "电网垂直领域大模型微调、GRPO 对齐与高性能部署 — 学习版"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.45.0",
    "trl>=0.12.0",
    "vllm>=0.8.0",
    "autoawq>=0.2.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
]

[project.scripts]
grid-llm-data = "grid_llm.data.download:main"
grid-llm-sft = "grid_llm.stage1_sft.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_llm"]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "black>=25.0.0",
    "isort>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, etc.)
    "I",    # isort (import order)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = ["E501"]  # line too long — black 负责

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.uv]
managed = true
